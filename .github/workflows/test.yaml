name: build-and-test
on:
  push:
    branches: [release]
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm npm:prepublish
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm vsc-compile:client
      - run: pnpm vsc-compile:server
      - run: pnpm test:server
      - run: pnpm test:parser
      - run: pnpm test:sqlint
      - run: pnpm --filter sql-lsp-monaco-editor-example build
  db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sqlls
          POSTGRES_PASSWORD: sqlls
          POSTGRES_DB: sqlls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlls"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqlls_test
          MYSQL_USER: sqlls
          MYSQL_PASSWORD: sqlls
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -usqlls -psqlls --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SQLLS_TEST_POSTGRES: postgres://sqlls:sqlls@127.0.0.1:5432/sqlls_test
      SQLLS_TEST_MYSQL: mysql://sqlls:sqlls@127.0.0.1:3306/sqlls_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sqlint
      - run: pnpm --filter sql-language-server test:db
  vscode-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minimum supported version (engines.vscode) and latest
        vscode-version: [1.101.0, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm test:vscode
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}
      - run: pnpm vscode:package
