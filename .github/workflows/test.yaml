name: build-and-test
on:
  push:
    branches: [release]
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm npm:prepublish
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm vsc-compile:client
      - run: pnpm vsc-compile:server
      - run: pnpm test:server
      - run: pnpm test:parser
      - run: pnpm test:sqlint
